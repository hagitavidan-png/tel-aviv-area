<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#132c52">
<title>למה לפתוח אזור תל אביב-יפו | מכורים אנונימיים</title>
<style>
  html{ color-scheme: light only; }
  :root{
    --navy:#132c52;
    --navy-deep:#0c1e3a;
    --blue:#2f6fb0;
    --gold:#c19a3f;
    --gold-light:#e4c974;
    --paper:#f6f3ec;
    --ink:#1c2333;
    --ink-soft:#4a5468;
    --card:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Segoe UI','Arial Hebrew','Noto Sans Hebrew',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    direction:rtl;
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:Georgia,'Times New Roman',serif;
    color:var(--navy);
  }
  a{color:inherit;}
  .container{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px;
  }

  /* NAV */
  header.nav{
    position:sticky; top:0; z-index:50;
    background:rgba(12,30,58,0.92);
    backdrop-filter:blur(6px);
    color:#fff;
    padding:14px 0;
    transition:box-shadow .3s;
  }
  header.nav.scrolled{ box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:12px; font-weight:bold; font-size:16px; letter-spacing:.5px; }
  .brand svg{ width:28px; height:28px; }
  nav.links{ display:flex; gap:26px; font-size:15px; }
  nav.links a{ text-decoration:none; opacity:.85; position:relative; padding-bottom:4px; }
